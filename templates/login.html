{% extends "base.html" %}

{% block title %}Sign in - Google Accounts{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-10">

    <div class="bg-white rounded-2xl p-8 sm:p-10 border border-google-border shadow-xs">
        
        <!-- Google Logo & Header -->
        <div class="text-center mb-8">
            <!-- Google 4-Color styled Logo Icon -->
            <div class="w-12 h-12 rounded-full bg-google-blue-light text-google-blue flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-google-dark" style="font-family: 'Google Sans', sans-serif;">
                Sign in to Admin Console
            </h1>
            <p class="text-xs text-google-gray mt-1">
                Google Workspace for Education &bull; AttendIQ System
            </p>
        </div>

        <!-- Login Form -->
        <form action="{{ url_for('login', next=request.args.get('next', '')) }}" method="POST" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-semibold text-google-dark uppercase mb-1.5">
                    Username or Email
                </label>
                <input type="text" id="username" name="username" required autofocus
                       placeholder="admin"
                       class="w-full px-3.5 py-2.5 rounded-lg border border-google-border focus:border-google-blue focus:ring-1 focus:ring-google-blue text-sm transition-all">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-google-dark uppercase mb-1.5">
                    Password
                </label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••••••"
                       class="w-full px-3.5 py-2.5 rounded-lg border border-google-border focus:border-google-blue focus:ring-1 focus:ring-google-blue text-sm transition-all">
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-2.5 px-4 rounded-full bg-google-blue hover:bg-google-blue-hover text-white font-medium text-sm shadow-xs transition-all">
                    Next
                </button>
            </div>
        </form>

        <!-- Credentials Hint -->
        <div class="mt-6 p-3.5 rounded-xl bg-slate-50 border border-google-border text-xs text-google-gray">
            <p class="font-medium text-google-dark mb-1">
                Evaluator Credentials:
            </p>
            <div class="flex items-center justify-between font-mono text-[11px] pt-1 border-t border-google-border">
                <span>User: <strong>admin</strong></span>
                <span>Pass: <strong>admin123</strong></span>
            </div>
        </div>

        <div class="mt-6 text-center text-xs text-google-gray">
            Student checking attendance? <a href="{{ url_for('student_lookup') }}" class="text-google-blue font-medium hover:underline">Lookup your record</a>
        </div>
    </div>

</div>
{% endblock %}
